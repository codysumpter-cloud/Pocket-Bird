name: Sync Windows Home fix dist

on:
  push:
    branches:
      - fix/windows-home-art-scale-motion
    paths:
      - .github/workflows/sync-windows-home-fix-dist.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-home-art-scale-motion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit deterministic tracked bundles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist ':!dist/extension.zip'
          if git diff --cached --quiet; then
            echo "Tracked dist is already synchronized."
            exit 0
          fi
          git commit -m "build: sync Windows Home repair bundles"
          git push origin HEAD:fix/windows-home-art-scale-motion
