name: Wire canonical Pocket Buddy Home

on:
  push:
    branches:
      - fix/windows-home-art-scale-motion
    paths:
      - .github/workflows/wire-canonical-home.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-home-art-scale-motion
          fetch-depth: 0
      - name: Wire canonical Home into desktop main and renderer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path('desktop/main.mjs')
          main = main_path.read_text()

          old = 'import { app, BrowserWindow, ipcMain, Menu, Tray, nativeImage, screen } from "electron";\n'
          new = old + 'import { createCanonicalHomeManager } from "./canonical-home.mjs";\n'
          assert old in main and 'createCanonicalHomeManager' not in main
          main = main.replace(old, new, 1)

          old = 'let desktopPrefsPath = null;\n'
          new = old + 'let canonicalHome = null;\n'
          assert old in main and 'let canonicalHome = null;' not in main
          main = main.replace(old, new, 1)

          old = 'applySelectedMonitorBounds();\n  overlayWindow?.webContents.send("pocket-buddy:displays-changed", displaySnapshot());'
          assert main.count(old) == 2, main.count(old)
          main = main.replace(old, 'applySelectedMonitorBounds();\n  canonicalHome?.reclamp();\n  overlayWindow?.webContents.send("pocket-buddy:displays-changed", displaySnapshot());')

          old = 'kind: item.kind === "human" ? "human" : "buddy",'
          assert old in main
          main = main.replace(old, 'kind: item.kind === "human" ? "human" : item.kind === "environment" ? "environment" : "buddy",', 1)

          marker = 'ipcMain.handle("pocket-buddy:select-display", async (_event, id) => chooseMonitor(id));\n'
          assert marker in main
          ipc = '''ipcMain.handle("pocket-buddy:open-home", async (event, options) => {
            if (!overlayWindow || overlayWindow.isDestroyed() || event.sender !== overlayWindow.webContents) {
              throw new Error("Canonical Home can only be opened by Pocket Buddy.");
            }
            if (!canonicalHome) throw new Error("Canonical Home is not ready yet.");
            return canonicalHome.open(options);
          });
          ipcMain.on("pocket-buddy:close-home", (event) => {
            if (overlayWindow && !overlayWindow.isDestroyed() && event.sender === overlayWindow.webContents) canonicalHome?.close();
          });
          ipcMain.on("pocket-buddy:home-close", (event) => {
            if (canonicalHome?.owns(event.sender)) canonicalHome.close();
          });
          ipcMain.on("pocket-buddy:home-care", (event, action) => {
            if (!canonicalHome?.owns(event.sender)) return;
            const allowed = new Set(["feed", "play", "pet", "nap", "clean", "medicine"]);
            const value = String(action ?? "");
            if (!allowed.has(value)) return;
            overlayWindow?.webContents.send("pocket-buddy:home-care", value);
          });
          '''
          main = main.replace(marker, marker + ipc, 1)

          old = '  await loadDesktopPreferences();\n  overlayWindow = createOverlayWindow();\n'
          new = '''  await loadDesktopPreferences();
            canonicalHome = createCanonicalHomeManager({
              getWorkArea: selectedWorkArea,
              getArtEntries: discoverBundledArt,
              readArtBytes: readBundledArt,
            });
            overlayWindow = createOverlayWindow();
          '''
          assert old in main
          main = main.replace(old, new, 1)

          old = 'app.on("before-quit", () => { quitting = true; });'
          assert old in main
          main = main.replace(old, 'app.on("before-quit", () => { quitting = true; void canonicalHome?.dispose(); });', 1)
          main_path.write_text(main)

          renderer_path = Path('desktop/renderer.js')
          renderer = renderer_path.read_text()
          marker = '  bridge.onCommand((command) => {'
          assert marker in renderer and 'bridge.onHomeCare' not in renderer
          care = '''  bridge.onHomeCare((action) => {
            const buddy = window.PocketBuddy;
            if (buddy?.care) void buddy.care(action);
          });

          '''
          renderer = renderer.replace(marker, care + marker, 1)

          marker = '        if (!entry?.sha256 || !entry?.importName) throw new Error("Bundled art manifest entry is incomplete.");\n'
          assert marker in renderer
          renderer = renderer.replace(marker, marker + '        if (entry.kind === "environment") { skipped += 1; continue; }\n', 1)
          renderer_path.write_text(renderer)
          PY
      - name: Syntax check canonical Home host
        run: |
          node --check desktop/main.mjs
          node --check desktop/canonical-home.mjs
          node --check desktop/renderer.js
          node --check desktop/preload.cjs
          node --check desktop/home-preload.cjs
          node --check desktop/pocket-buddy-home-actors.js
          node --check src/buddy/home.js
      - name: Commit wiring and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wire-canonical-home.yml
          git add desktop/main.mjs desktop/renderer.js
          git commit -m "fix(home): launch canonical PocketBuddy+ TinyHouse runtime"
          git push origin HEAD:fix/windows-home-art-scale-motion
