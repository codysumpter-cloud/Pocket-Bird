name: Sync simple-menu dist

on:
  push:
    branches:
      - cleanup/simple-menu-field-guide
    paths:
      - .github/workflows/sync-simple-menu-dist.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/simple-menu-field-guide
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit deterministic tracked bundles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist ':!dist/extension.zip'
          if git diff --cached --quiet; then
            echo "Tracked dist is already synchronized."
            exit 0
          fi
          git commit -m "build: sync Pocket Buddy simple-menu bundles"
          git push origin HEAD:cleanup/simple-menu-field-guide
