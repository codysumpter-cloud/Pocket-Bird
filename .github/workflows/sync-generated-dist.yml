name: Sync generated dist (temporary)

on:
  pull_request:
    paths:
      - "src/**"
      - "sprites/**"
      - "fonts/**"
      - "images/**"
      - "build.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/sync-generated-dist.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated dist to PR branch
        shell: bash
        run: |
          if git diff --quiet -- dist; then
            echo "dist is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "build: publish Pocket Buddy 1.1.0 generated bundles"
          git push origin HEAD:${{ github.head_ref }}
