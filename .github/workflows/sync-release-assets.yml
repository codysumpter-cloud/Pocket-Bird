name: Sync Pocket Buddy 1.2.0 release assets

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/postprocess-build.mjs"
      - ".github/workflows/sync-release-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sync package lock to package metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Install locked dependencies
        run: npm ci
      - name: Build all generated formats
        run: npm run build
      - name: Commit generated release assets
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json dist; then
            echo "release assets already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json dist
          git commit -m "build: publish Pocket Buddy 1.2.0 generated assets"
          git push origin HEAD:${{ github.head_ref }}
