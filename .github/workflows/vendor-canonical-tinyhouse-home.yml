name: Vendor canonical TinyHouse Home

on:
  push:
    branches:
      - fix/windows-home-art-scale-motion
    paths:
      - .github/workflows/vendor-canonical-tinyhouse-home.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-home-art-scale-motion
          fetch-depth: 0
      - name: Fetch verified PocketBuddy+ TinyHouse Home donor
        shell: bash
        run: |
          set -euo pipefail
          donor_sha='6e4a80775f8a7f5b0d243b0a9f50e6653526219b'
          git clone --filter=blob:none --no-checkout https://github.com/codysumpter-cloud/PocketBuddyPlus.git /tmp/PocketBuddyPlus
          git -C /tmp/PocketBuddyPlus checkout "$donor_sha" -- games/tinyhouse-local
          rm -rf desktop/tinyhouse-home
          mkdir -p desktop/tinyhouse-home
          cp -a /tmp/PocketBuddyPlus/games/tinyhouse-local/. desktop/tinyhouse-home/
          printf '%s\n' "$donor_sha" > desktop/tinyhouse-home/POCKETBUDDYPLUS_DONOR_COMMIT
      - name: Commit exact donor and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/vendor-canonical-tinyhouse-home.yml
          git add desktop/tinyhouse-home
          git commit -m "fix(home): vendor canonical PocketBuddy+ TinyHouse runtime"
          git push origin HEAD:fix/windows-home-art-scale-motion
